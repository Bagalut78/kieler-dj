<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Outer Vinyl Black Disk -->
  <circle cx="64" cy="64" r="60" fill="#121212" />
  
  <!-- Grooves (subtle reflection rings) -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#2a2a2a" stroke-width="2" />
  <circle cx="64" cy="64" r="42" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="6 3" />
  <circle cx="64" cy="64" r="34" fill="none" stroke="#2a2a2a" stroke-width="1.5" />
  
  <!-- Center Label - Bright Yellow for Pop Art Contrast -->
  <circle cx="64" cy="64" r="20" fill="#ffde00" stroke="#121212" stroke-width="3" />
  
  <!-- Center Spindle Hole -->
  <circle cx="64" cy="64" r="5" fill="#fcfaf2" stroke="#121212" stroke-width="2" />
  
  <!-- Stylized Retro Star Details on Label -->
  <path d="M64 54l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#121212" />
</svg>
